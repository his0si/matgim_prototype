<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style><title>맡김 · 사장님 광고, 맡기기만 하세요</title>
<meta name="description" content="맡김 — 사장님 광고, 맡기기만 하세요. 시연용 프로토타입.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Batang:wght@700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F4E9D2'/%3E%3Cpath d='M50 32c18 0 34 13 34 30 0 16-14 26-34 26S16 78 16 62c0-17 16-30 34-30z' fill='%231F6F4E'/%3E%3Cpath d='M37 62l10 10 18-20' fill='none' stroke='%23F4E9D2' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head><body>
<style>
:root{
  --bg:#ECEAE0; --paper:#FAF7F0; --surface:#FFFFFF; --ink:#1C2620; --ink-2:#4A554F; --muted:#7A847E;
  --line:#D9DED7; --line-strong:#B8C0B9;
  --green:#1F6F4E; --green-ink:#FFFFFF; --green-soft:#E3F0E9;
  --yellow:#E9A93B; --yellow-soft:#F6E7C8; --yellow-ink:#3A2E08;
  --blue:#3C6E9F; --blue-soft:#E4EDF6;
  --red:#B9483D; --red-soft:#F7E3E0;
  --shadow:0 18px 50px rgba(28,38,32,.16);
  --radius:22px;
  --fs:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10150F; --paper:#171D18; --surface:#1F2721; --ink:#EDEFE8; --ink-2:#BEC5BD; --muted:#8B958D;
    --line:#2C352E; --line-strong:#465049;
    --green:#4FB585; --green-ink:#0E1A13; --green-soft:#1D3328;
    --yellow:#E8B84A; --yellow-soft:#3A3016; --yellow-ink:#F7E7B8;
    --blue:#7FAEDC; --blue-soft:#1B2A3A;
    --red:#E07A6E; --red-soft:#3B2220;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#10150F; --paper:#171D18; --surface:#1F2721; --ink:#EDEFE8; --ink-2:#BEC5BD; --muted:#8B958D;
  --line:#2C352E; --line-strong:#465049;
  --green:#4FB585; --green-ink:#0E1A13; --green-soft:#1D3328;
  --yellow:#E8B84A; --yellow-soft:#3A3016; --yellow-ink:#F7E7B8;
  --blue:#7FAEDC; --blue-soft:#1B2A3A;
  --red:#E07A6E; --red-soft:#3B2220;
  --shadow:0 18px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- stage ---------- */
.stage{min-height:100vh;display:grid;grid-template-columns:1fr minmax(0,420px) minmax(280px,360px) 1fr;gap:36px;align-items:start;padding:36px 20px}
.stage>.spacer{min-width:0}
.phone{grid-column:2;position:sticky;top:36px;width:100%;max-width:420px;height:min(880px,calc(100vh - 72px));min-height:640px;background:var(--paper);border-radius:44px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.status b{color:var(--ink);font-weight:700}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 22px 28px;display:flex;flex-direction:column;font-size:calc(17px * var(--fs))}
.screen::-webkit-scrollbar{width:0}
.side{grid-column:3;position:sticky;top:36px;display:flex;flex-direction:column;gap:18px}
@media (max-width:900px){
  .stage{grid-template-columns:1fr;gap:20px;padding:16px 12px}
  .phone{grid-column:1;position:static;margin:0 auto;height:auto;min-height:calc(100vh - 32px);border-radius:28px}
  .side{grid-column:1;position:static;max-width:420px;margin:0 auto}
  .spacer{display:none}
}

/* ---------- side panel ---------- */
.brand{display:flex;align-items:center;gap:14px}
.appicon{width:64px;height:64px;border-radius:22%;overflow:hidden;flex:none;box-shadow:0 6px 18px rgba(28,38,32,.18)}
.appicon svg{display:block;width:100%;height:100%}
.logo-sm{width:36px;height:36px;border-radius:26%;overflow:hidden;flex:none}
.logo-sm svg{display:block;width:100%;height:100%}
.wordmark{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.25em;color:var(--green);letter-spacing:-.01em}
.brand .mark{font-family:"Gowun Batang",serif;font-weight:700;font-size:28px;color:var(--green);letter-spacing:-.01em}
.brand .tag{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.panel h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel .now{font-size:18px;font-weight:900;margin:0 0 6px}
.panel p{margin:0;font-size:14px;color:var(--ink-2)}
.chain{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.chain li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);padding:4px 0}
.chain li i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:inline-block}
.chain li.done{color:var(--ink-2)}
.chain li.done i{background:var(--green);border-color:var(--green)}
.chain li.now{color:var(--ink);font-weight:700}
.chain li.now i{border-color:var(--yellow);background:var(--yellow)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.jump button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--ink-2)}
.jump button:hover{border-color:var(--green);color:var(--green)}
.side .note{font-size:12px;color:var(--muted);padding:0 4px}

/* ---------- app primitives ---------- */
.top{display:flex;align-items:center;gap:8px;min-height:52px;flex:none;margin-bottom:6px}
.top .back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;display:grid;place-items:center;margin-left:-6px}
.top .ttl{font-size:1em;font-weight:700;color:var(--ink-2);flex:1}
.top .a11y{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.top .a11y.on{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
h1{font-size:1.65em;line-height:1.28;font-weight:900;margin:8px 0 8px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:1.2em;font-weight:900;margin:22px 0 10px;letter-spacing:-.01em}
.lead{color:var(--ink-2);margin:0 0 18px;font-size:1em}
.small{font-size:.82em;color:var(--muted)}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}

.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:64px;border-radius:18px;border:2px solid transparent;font-size:1.1em;font-weight:900;padding:14px 18px;text-align:center;letter-spacing:-.01em;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--green);color:var(--green-ink)}
.btn.secondary{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.yellow{background:var(--yellow);color:var(--yellow-ink)}
.btn.ghost{background:transparent;min-height:48px;font-size:.95em;font-weight:700;color:var(--ink-2)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn .sub{display:block;font-size:.72em;font-weight:500;opacity:.85}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.one{grid-template-columns:1fr}
.tile{min-height:88px;border-radius:18px;border:2px solid var(--line);background:var(--surface);padding:14px 14px;text-align:left;font-size:1em;font-weight:700;display:flex;flex-direction:column;justify-content:center;gap:4px;line-height:1.3;position:relative}
.tile .ic{font-size:1.45em;line-height:1}
.tile .d{font-size:.78em;font-weight:500;color:var(--muted)}
.tile.sel{border-color:var(--green);background:var(--green-soft)}
.tile.sel::after{content:"✓";position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--green);color:var(--green-ink);font-size:14px;display:grid;place-items:center;font-weight:900}
.tile.wide{grid-column:1/-1;min-height:64px;flex-direction:row;align-items:center;justify-content:space-between;font-weight:500;color:var(--ink-2);border-style:dashed}

.progress{display:flex;gap:5px;margin:4px 0 14px}
.progress i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.progress i.on{background:var(--green)}
.progress i.now{background:var(--yellow)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card.flat{background:transparent;border-style:dashed}
.card h3{margin:0 0 4px;font-size:1.05em;font-weight:900}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95em}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78em;font-weight:700;line-height:1.3}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.y{background:var(--yellow-soft);color:var(--yellow-ink)}
.pill.b{background:var(--blue-soft);color:var(--blue)}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.n{background:var(--bg);color:var(--muted)}

.fit{display:flex;align-items:center;gap:12px;padding:16px;border:2px solid var(--line);border-radius:20px;background:var(--surface);text-align:left;width:100%}
.fit .ic{font-size:2em;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--bg);flex:none}
.fit .body{flex:1;min-width:0}
.fit .name{font-weight:900;font-size:1.05em}
.fit .why{font-size:.85em;color:var(--ink-2);margin-top:2px}
.fit.best{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.fit .arrow{color:var(--muted);font-size:1.3em}
.fit.dim{opacity:.6}

.creator{border:2px solid var(--line);border-radius:22px;background:var(--surface);overflow:hidden}
.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.1em;flex:none}
.creator .hd{display:flex;gap:12px;padding:16px 16px 8px;align-items:center}
.creator .nm{font-weight:900;font-size:1.05em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.creator .hnd{font-size:.8em;color:var(--muted);font-weight:500}
.creator .meta{font-size:.82em;color:var(--muted)}
.creator .nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:6px 16px 0}
.creator .nums div{background:var(--bg);border-radius:12px;padding:8px 10px;text-align:center}
.creator .nums b{display:block;font-size:1.05em;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.creator .nums span{font-size:.72em;color:var(--muted)}
.creator .sec{padding:12px 16px 0;font-size:.78em;color:var(--muted);font-weight:700;letter-spacing:.02em}
.creator .reels{display:flex;gap:6px;padding:6px 16px 0;overflow-x:auto;scrollbar-width:none}
.creator .reels::-webkit-scrollbar{display:none}
.creator .reels span{flex:none;width:112px;aspect-ratio:9/13;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;padding:8px;font-size:.68em;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6);line-height:1.25}
.creator .reels em{font-style:normal;font-size:1.05em;opacity:.95;font-variant-numeric:tabular-nums}
.creator .why{margin:10px 16px 0;font-size:.88em;color:var(--ink-2);padding:10px 12px;background:var(--green-soft);border-radius:12px;line-height:1.5}
.creator .why b{color:var(--green)}
.creator .pk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 0;font-size:.92em}
.creator .price{font-size:1.25em;font-weight:900;font-variant-numeric:tabular-nums;flex:none}
.creator .act{padding:12px 16px 16px}

.brief{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;font-size:.95em;line-height:1.7}
.brief .hd{font-size:.78em;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px;text-transform:uppercase}
.brief p{margin:0 0 8px}
.brief mark{background:var(--yellow-soft);color:var(--ink);padding:0 3px;border-radius:4px}

.input{width:100%;min-height:64px;border:2px solid var(--line-strong);border-radius:18px;background:var(--surface);color:var(--ink);font:inherit;font-size:1.05em;padding:14px 18px}
.input:focus{outline:3px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.scan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:.95em}
.scan li{display:flex;align-items:center;gap:10px;color:var(--muted)}
.scan li::before{content:"";width:22px;height:22px;border-radius:50%;border:3px solid var(--line);flex:none}
.scan li.on{color:var(--ink);font-weight:700}
.scan li.on::before{background:var(--green);border-color:var(--green);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.photos span{aspect-ratio:1;border-radius:10px;display:flex;align-items:flex-end;padding:6px;font-size:.7em;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.sec2{font-size:.78em;color:var(--muted);font-weight:700;margin-top:12px}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kws span{background:var(--bg);border-radius:999px;padding:5px 11px;font-size:.82em;font-weight:700}
.kws b{color:var(--green);font-variant-numeric:tabular-nums}
.brief h4{margin:16px 0 6px;font-size:.78em;letter-spacing:.04em;color:var(--green);font-weight:900;text-transform:uppercase}
.brief h4:first-of-type{margin-top:10px}
.brief ul{margin:0;padding-left:1.1em}
.brief li{margin:0 0 4px}
.brief .conti{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.92em}
.brief .conti b{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.brief .q{border-left:3px solid var(--yellow);padding-left:10px;color:var(--ink-2);margin:0 0 6px;font-size:.92em}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:0 0 18px;position:relative}
.timeline li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--line-strong);background:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:900}
.timeline li.done .dot{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.timeline li.now .dot{border-color:var(--yellow);background:var(--yellow);color:var(--yellow-ink)}
.timeline .t{font-weight:900}
.timeline .s{font-size:.85em;color:var(--muted)}
.timeline li.wait{opacity:.55}

.video{aspect-ratio:9/12;border-radius:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;background:linear-gradient(160deg,#5b3a1e,#1b3a2a 60%,#0d1f16)}
.video::before{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:52px;opacity:.85}
.video .cap{font-weight:900;font-size:1.05em;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.video .by{font-size:.8em;opacity:.9}

.stat{display:flex;align-items:baseline;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .n{font-size:1.8em;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:3.2ch;text-align:right}
.stat .l{font-size:1em;color:var(--ink-2)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px}

.feed{display:flex;flex-direction:column;gap:14px}
.reel{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.reel .thumb{aspect-ratio:16/10;display:flex;align-items:flex-end;padding:14px;color:#fff;position:relative}
.reel .thumb::after{content:"예시";position:absolute;top:10px;right:10px;font-size:11px;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:999px}
.reel .thumb b{font-size:1.1em;text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.3}
.reel .bd{padding:12px 14px 14px}
.reel .bd p{margin:4px 0 10px;font-size:.9em;color:var(--ink-2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -22px;padding-left:22px;padding-right:22px}
.chips button{flex:none;border-radius:999px;padding:8px 14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.9em}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.like{border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:700;font-size:.92em;width:100%}
.like.on{border-color:var(--yellow);background:var(--yellow-soft);color:var(--yellow-ink)}

.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:90%}
.toast.show{opacity:1}
.home-hero{background:var(--green);color:var(--green-ink);border-radius:26px;padding:22px 22px 20px;margin-top:6px}
.home-hero .hi{font-size:.9em;opacity:.85}
.home-hero h1{margin:4px 0 0;color:inherit;font-size:1.5em}
.helper{display:flex;gap:10px;align-items:center;border:1px dashed var(--line-strong);border-radius:16px;padding:12px 14px;font-size:.88em;color:var(--ink-2);background:transparent;width:100%;text-align:left}
.helper .ic{font-size:1.4em}
.mini{display:flex;justify-content:space-between;align-items:center;background:var(--yellow-soft);color:var(--yellow-ink);border-radius:18px;padding:14px 16px;border:0;width:100%;text-align:left;font-weight:700;font-size:.95em}
.mini .st{font-size:.8em;font-weight:500;opacity:.85;display:block}
.step-in{animation:in .22s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<div class="stage">
  <div class="spacer"></div>
  <div class="phone">
    <div class="status"><b id="clock">9:41</b><span>맡김 · 시연용 프로토타입</span><span>●●●</span></div>
    <div class="screen" id="screen"></div>
    <div class="toast" id="toast"></div>

  if(biz==='학원·교육'){sc.blog+=2;sc.local+=1;why.blog.push('학원은 글로 꼼꼼히 비교하고 정해요')}
  if(biz==='마트·소매'){sc.local+=2;why.local.push('할인·행사 소식은 동네 계정이 빨라요')}
  if(biz==='기타 서비스'){sc.blog+=2;why.blog.push('서비스 업체는 검색으로 찾는 경우가 많아요')}
  /* 목표 */
  if(has(goal,'단골')||has(goal,'재등록')||has(goal,'재방문')||has(goal,'재이용')){sc.local+=2;why.local.push('이미 아는 손님에게 다시 알리기 좋아요')}
  if(has(goal,'배달')){sc.reels+=1;sc.blog+=1}
  if(has(goal,'알리기')){sc.reels+=1;sc.local+=1}
  if(has(goal,'문의')||has(goal,'상담')||has(goal,'예약')){sc.blog+=2;why.blog.push('문의는 검색해서 들어온 분이 제일 많이 해요')}
  if(has(goal,'단체')){sc.blog+=1;sc.local+=1}
  /* 예산 */
  if(budget.startsWith('10만원')){sc.local+=2;sc.shorts-=3;why.local.push('10만원 안쪽으로도 가능해요')}
  if(budget.startsWith('10만 ~')){sc.shorts-=2}
  /* 자랑거리 */
  if(has(pride,'역사')){sc.shorts+=1;sc.blog+=1;why.shorts.push('오래된 가게 이야기는 멀리까지 퍼져요')}
  if(has(pride,'가격')||has(pride,'수강료')){sc.reels+=1;sc.local+=1}
  if(has(pride,'분위기')||has(pride,'사진')||has(pride,'공간')){sc.reels+=2;why.reels.push('공간과 분위기는 영상이 제일 잘 보여줘요')}
  if(has(pride,'실력')||has(pride,'실적')||has(pride,'경력')){sc.blog+=2;why.blog.push('실력·실적은 글로 자세히 써야 믿어요')}
  if(has(pride,'공부')||has(pride,'자습실')){sc.reels+=1;sc.blog+=1;why.reels.push('"공부하기 좋은 자리"는 학생들 사이에서 영상으로 퍼져요')}
  if(has(pride,'1:1')||has(pride,'상담')||has(pride,'꼼꼼')){sc.blog+=1}
  if(has(pride,'배달')||has(pride,'출장')||has(pride,'늦게')){sc.local+=1}
  const sk=(S.shop?S.shop.keywords.map(k=>k[0]).join(' '):'');
  if(sk.includes('조용')||sk.includes('콘센트')||sk.includes('자습실')){sc.reels+=1;why.reels.push('리뷰에 자리·공간 얘기가 많아서 영상으로 보여주면 좋아요')}
  if(sk.includes('가성비')||sk.includes('싸요')||sk.includes('착해요')){sc.local+=1}
  if(S.likes.size){ [...S.likes].forEach(k=>{ if(['산책형','인사형','과정형','공간형','전후형'].includes(k)) sc.reels+=1; if(k==='후기형'||k==='강의형') sc.blog+=1; }); }
  return Object.keys(sc).map(k=>({k,score:sc[k],why:why[k][0]||MEDIA[k].desc})).sort((a,b)=>b.score-a.score);
}

  <div class="brief" style="margin-top:12px">

    <h4>이 가게는</h4>
    <p><mark>${sh.name}</mark> (${sh.addr}). 주 손님은 <mark>${b.who}</mark>, 자랑거리는 <mark>${b.pride}</mark>. 손님들이 리뷰에서 제일 많이 한 말은 <mark>"${kw[0]}"</mark>(${sh.keywords[0][1]}번)이고, 다음이 "${kw[1]}", "${kw[2]}"예요. 분위기: ${sh.vibe}.</p>
    <h4>이번 광고의 목표</h4>
    <p><mark>${b.goal}</mark>. 영상을 본 사람이 "${kw[0]}"를 기억하고 위치를 저장하게 만드는 게 핵심이에요.</p>
    <h4>꼭 담을 장면 3개</h4>
    <ul><li><b>${scenes[0]}</b> — 등록 사진 중 리뷰에 가장 많이 언급된 장면</li><li><b>${sh.signature}</b> — 대표 메뉴, 만드는 손이나 결과물 클로즈업</li><li><b>${scenes[2]}</b> — 가게가 어디인지 알 수 있는 컷 (입구·간판·창가)</li></ul>
    <h4>손님 말 그대로 자막에 쓰세요</h4>
    ${sh.quotes.slice(0,2).map(q=>`<p class="q">"${q}"</p>`).join('')}
    <h4>톤 · 요즘 흐름</h4>
    <p>${trendNoteFor(a)} ${styleLine}</p>
    <h4>콘티 제안 (${m.name==='네이버 블로그'?'글 구성':'15~20초'})</h4>
    <div class="conti">
      <b>0–2초</b><span>${sh.signature.split(' + ')[0]} 결과물부터. 자막: "${kw[0].replace('요','')}, 이대 앞 ${a.biz==='학원·교육'?'학원':'가게'}"</span>
      <b>3–10초</b><span>${scenes[0]} → ${scenes[1]} 순서로 훑기. 말 없이, 자막만.</span>
      <b>11–15초</b><span>${a.photo==='찍어 둔 게 있어요'?'사장님이 주신 사진 1장 삽입':'사장님 인사 한 컷 (얼굴 나오면 신뢰↑)'}</span>
      <b>마지막 3초</b><span>가격·위치 고정 자막: "${menuTop} · ${sh.addr.split(',')[0]}"</span>
    </div>
    <h4>이건 피해 주세요</h4>
    <ul><li>가격은 검색 결과 기준으로 정확히 (${sh.menu[0][0]} ${sh.menu[0][1]?won(sh.menu[0][1]):'무료'})</li><li>손님 얼굴이 나오는 컷은 쓰지 않기</li><li>리뷰에 없는 표현("최고", "1위") 넣지 않기</li></ul>
    <h4>게시 추천 시점</h4>
    <p>${sh.best}. 게시 전에 사장님 확인을 받아 주세요.</p>
    <p class="small" style="margin-top:12px">촬영: ${a.photo==='찍어 둔 게 있어요'?'사장님 보유 사진·영상 사용':'방문 촬영'} · 결과물: ${m.name} · ${b.pkg}</p>
  </div>
  <div class="grow"></div>
  <div class="stack" style="margin-top:18px">
    <button class="btn primary" onclick="go('progress');toast('크리에이터에게 전달됐어요')">맞아요, 이대로 보내 주세요</button>
    <button class="btn ghost" onclick="toast('고칠 부분을 고르는 화면(시연 생략)')">고칠 게 있어요</button>
  </div>`;
}

const STAGES=[
  {t:'접수 완료',s:'결제금은 토스페이먼츠가 보관 중'},
  {t:'크리에이터가 가게에 와요',s:'9월 9일(화) 오후 2시 방문 · 30분'},
  {t:'영상 확인해 주세요',s:'사장님 할 일 · 네/아니요 한 번'},
  {t:'게시 중',s:'2주 동안 올라가 있어요'},
  {t:'결과 나왔어요',s:'문장으로 정리해 드렸어요'},
];
function progressScreen(){
  const c=S.creator;
  return `${topbar('진행 현황')}
  <h1>${c.n}님이 진행 중이에요</h1>
  <p class="lead">단계가 바뀌면 카카오톡으로 알려 드려요. 사장님이 하실 일은 한 번뿐이에요.</p>
  <ul class="timeline">
    ${STAGES.map((st,i)=>`<li class="${i<S.stage?'done':i===S.stage?'now':'wait'}"><span class="dot">${i<S.stage?'✓':i+1}</span><div><div class="t">${st.t}</div><div class="s">${st.s}</div>
      ${i===2&&S.stage===2?`<button class="btn yellow" style="margin-top:10px;min-height:56px" onclick="go('review')">영상 보고 답하기</button>`:''}
      ${i===4&&S.stage===4?`<button class="btn primary" style="margin-top:10px;min-height:56px" onclick="go('result2')">결과 보기</button>`:''}
    </div></li>`).join('')}
  </ul>
  <div class="grow"></div>
  ${S.stage<2||S.stage===3?`<button class="btn ghost" onclick="S.stage++;render();toast('(시연) 다음 단계로 넘어갔어요')">▶ 시연용 · 시간을 앞으로</button>`:''}
  <button class="btn ghost" onclick="S.history=[];go('home',false)">홈으로</button>`;
}

function reviewScreen(){
  const c=S.creator; const m=MEDIA[S.media];
  if(S.review==='no'){
    return `${topbar('고쳐 달라고 하기')}
    <h1>어떤 점이 마음에 안 드세요?</h1>
    <p class="lead">고르시면 ${c.n}님께 그대로 전달돼요.</p>
    <div class="tiles">
      ${[['🏪','우리 가게가 잘 안 보여요'],['💰','가격·메뉴가 틀렸어요'],['🎭','분위기가 우리랑 안 맞아요'],['🗣️','말이 너무 빨라요'],['📍','위치 안내가 없어요'],['✍️','직접 말할게요 (전화)']].map(([ic,l])=>`<button class="tile" onclick="S.review=null;go('progress');toast('${c.n}님께 전달했어요 · 2일 안에 다시 올려요')"><span class="ic">${ic}</span><span>${l}</span></button>`).join('')}
    </div>
    <div class="grow"></div>
    <button class="btn ghost" onclick="S.review=null;render()">돌아가기</button>`;
  }
  return `${topbar('영상 확인')}
  <h1>이대로 올릴까요?</h1>
  <p class="lead">${c.n}님이 만든 ${m.name} 영상이에요. 눌러서 보세요.</p>
  <div class="video" onclick="toast('시연용 영상 자리예요')"><div class="cap">"거지 백수의 이대 앞 혼놀 카페"</div><div class="by">${m.name} · ${c.n} · 0:28</div></div>
  <div class="grow"></div>
  <div class="stack" style="margin-top:18px">
    <button class="btn primary" style="min-height:76px" onclick="S.stage=3;go('progress');toast('좋아요! 토스페이먼츠가 결제금을 보냈어요')">네, 좋아요<span class="sub">이 버튼을 누르면 토스페이먼츠가 보관 중인 돈을 ${c.n}님께 보내요</span></button>
    <button class="btn danger" onclick="S.review='no';render()">아니요, 고쳐 주세요</button>
  </div>`;
}

function result2Screen(){
  const c=S.creator, m=MEDIA[S.media];
  const stats=[[3240,'명이 영상을 봤어요',100],[186,'명이 가게 정보를 눌러봤어요',48],[45,'명이 가게 위치를 저장했어요',22],[12,'명이 전화 버튼을 눌렀어요',9]];
  return `${topbar('광고 결과')}
  <span class="pill g">2주 게시 끝</span>
  <h1>이번 광고,<br>이렇게 됐어요</h1>
  <p class="lead">${c.n}님 ${m.name} · 9월 12일 ~ 26일</p>
  <div class="card" style="padding:6px 18px">
    ${stats.map(([n,l,p])=>`<div class="stat"><span class="n">${n.toLocaleString()}</span><span class="l" style="flex:1">${l}<div class="bar"><i style="width:${p}%"></i></div></span></div>`).join('')}
  </div>
  <p class="small" style="margin:12px 4px 0">비슷한 가게들과 견주면 <b style="color:var(--green)">위치 저장이 많은 편</b>이에요. 근처에서 찾아올 손님이 생겼다는 뜻이에요.</p>
  <div class="grow"></div>
  <div class="stack" style="margin-top:18px">
    <button class="btn primary" style="min-height:76px" onclick="S.pay='카드로';go('confirm');toast('같은 조건으로 다시 준비했어요')">${c.n}님께 또 맡기기<span class="sub">같은 조건 · ${won(c.price)} · 답 다시 안 해도 돼요</span></button>
    <button class="btn secondary" onclick="go('result')">다른 종류 광고 해보기</button>
    <button class="btn ghost" onclick="S.ordered=false;S.stage=0;S.history=[];go('home',false)">이번엔 여기까지</button>
  </div>`;
}

function trendsScreen(){
  const cats=['전체','음식점','카페·빵집','미용·뷰티','마트·소매','학원·교육','기타 서비스'];
  const list=TRENDS.filter(t=>S.trendFilter==='전체'||t.biz.includes(S.trendFilter));
  return `${topbar('요즘 광고 구경')}
  <h1>요즘 가게들은<br>이렇게 광고해요</h1>
  <p class="lead">마음에 드는 걸 <b>"우리 가게도 이렇게"</b> 눌러 두세요. 추천할 때 반영돼요.</p>
  <div class="chips">${cats.map(c=>`<button class="${S.trendFilter===c?'on':''}" onclick="S.trendFilter='${c}';render()">${c}</button>`).join('')}</div>
  <div class="feed" style="margin-top:8px">
    ${list.map(t=>`<div class="reel"><div class="thumb" style="background:${t.g}"><b>${t.t}</b></div>
      <div class="bd"><span class="pill n">${t.k}</span><p>${t.d}</p>
      <button class="like ${S.likes.has(t.k)?'on':''}" onclick="S.likes.has('${t.k}')?S.likes.delete('${t.k}'):S.likes.add('${t.k}');render()">${S.likes.has(t.k)?'✓ 우리 가게도 이렇게 (찜함)':'우리 가게도 이렇게'}</button></div></div>`).join('')}
  </div>
  <div class="stack" style="margin-top:18px">
    <button class="btn primary" onclick="startQ()">이제 광고 맡기러 가기${S.likes.size?`<span class="sub">찜한 스타일 ${S.likes.size}개 반영</span>`:''}</button>
  </div>`;
}

/* ---------------- render ---------------- */
const SCREENS={home:homeScreen,q:qScreen,result:resultScreen,creators:creatorsScreen,confirm:confirmScreen,brief:briefScreen,progress:progressScreen,review:reviewScreen,result2:result2Screen,trends:trendsScreen};
function render(){
  document.documentElement.style.setProperty('--fs',S.big?'1.22':'1');
  const el=$('#screen'); el.innerHTML=SCREENS[S.screen](); el.scrollTop=0;
  const sd=SIDE[S.screen]; $('#side-now').textContent=sd.t; $('#side-desc').textContent=sd.d;
  const maxDone=Math.max(-1,...sd.chain);
  $('#chain').innerHTML=CHAIN.map((c,i)=>`<li class="${sd.chain.includes(i)?(i===maxDone?'now':'done'):''}"><i></i>${c}</li>`).join('');
}
function demo(sc){
  if(!S.ans.who){S.ans={biz:S.ans.biz||'카페·빵집',addr:SHOPS['카페·빵집'].addr,who:'대학생',pride:['착한 가격','공부·작업하기 좋은 자리'],goal:'새 손님이 찾아오게',budget:'10만 ~ 30만원',photo:'없어요, 와서 찍어 주세요'}; S.shop=shopOf(S.ans); S.lookup='done';}
  if(!S.media) S.media='reels'; if(!S.creator) S.creator=REAL.nyol;
  if(['brief','progress','review','result2'].includes(sc)){S.ordered=true; S.pay=S.pay||'카드로'}
  if(sc==='review') S.stage=2; if(sc==='result2') S.stage=4; if(sc==='progress'&&S.stage===0) S.stage=1;
  S.history=[]; go(sc,false);
}
$('#jump').innerHTML=Object.keys(SIDE).map(k=>`<button onclick="demo('${k}')">${SIDE[k].t}</button>`).join('');
(function clock(){const d=new Date();$('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');setTimeout(clock,30000)})();
render();
</script>

</body></html>
